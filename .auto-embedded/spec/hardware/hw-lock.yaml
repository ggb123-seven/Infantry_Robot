# 硬件资源锁（机器可读）。RESEARCH 阶段填写并冻结；SessionStart hook 注入其摘要。
# 同一资源不可重复占用——填写时自查 pin/dma/irq/timer 无重复。
# 示例条目见注释，正式条目顶格写在各 section 下。

pins:
  - {id: PA13, func: SYS_JTMS_SWDIO, owner: cubemx_sys}
  - {id: PA14, func: SYS_JTCK_SWCLK, owner: cubemx_sys}
  - {id: PH0, func: RCC_OSC_IN_HSE, owner: cubemx_rcc}
  - {id: PH1, func: RCC_OSC_OUT_HSE, owner: cubemx_rcc}
  - {id: PH10, func: GPIO_OUTPUT_LED_B, owner: cubemx_gpio}
  - {id: PH11, func: GPIO_OUTPUT_LED_G, owner: cubemx_gpio}
  - {id: PH12, func: GPIO_OUTPUT_LED_R, owner: cubemx_gpio}
  - {id: PD0, func: CAN1_RX, owner: cubemx_can1}
  - {id: PD1, func: CAN1_TX, owner: cubemx_can1}
  - {id: PB5, func: CAN2_RX, owner: cubemx_can2}
  - {id: PB6, func: CAN2_TX, owner: cubemx_can2}
  - {id: PA11, func: USB_OTG_FS_DM, owner: cubemx_usb_device_cdc}
  - {id: PA12, func: USB_OTG_FS_DP, owner: cubemx_usb_device_cdc}
  - {id: PC10, func: USART3_TX, owner: cubemx_dr16_uart}
  - {id: PC11, func: USART3_RX, owner: cubemx_dr16_uart}
  - {id: PA4, func: GPIO_OUTPUT_BMI088_ACCEL_CS, owner: cubemx_bmi088}
  - {id: PA7, func: SPI1_MOSI, owner: cubemx_bmi088}
  - {id: PB0, func: GPIO_OUTPUT_BMI088_GYRO_CS, owner: cubemx_bmi088}
  - {id: PB3, func: SPI1_SCK, owner: cubemx_bmi088}
  - {id: PB4, func: SPI1_MISO, owner: cubemx_bmi088}
  - {id: PC4, func: EXTI4_BMI088_ACCEL_INT, owner: cubemx_bmi088}
  - {id: PC5, func: EXTI5_BMI088_GYRO_INT, owner: cubemx_bmi088}
  - {id: PF6, func: TIM10_CH1_IMU_HEAT_PWM, owner: cubemx_bmi088}

dma:
  - {stream: DMA1_Stream1_CH4, peripheral: USART3_RX, owner: cubemx_dr16_uart}
  - {stream: DMA2_Stream2_CH3, peripheral: SPI1_RX, owner: cubemx_bmi088}
  - {stream: DMA2_Stream3_CH3, peripheral: SPI1_TX, owner: cubemx_bmi088}

irq:
  - {irqn: PendSV_IRQn, priority_preempt: 15, priority_sub: 0, owner: freertos}
  - {irqn: SysTick_IRQn, priority_preempt: 15, priority_sub: 0, owner: freertos}
  - {irqn: CAN1_RX0_IRQn, priority_preempt: 5, priority_sub: 0, owner: cubemx_can1}
  - {irqn: CAN2_RX0_IRQn, priority_preempt: 5, priority_sub: 0, owner: cubemx_can2}
  - {irqn: CAN2_TX_IRQn, priority_preempt: 5, priority_sub: 0, owner: cubemx_can2}
  - {irqn: TIM6_DAC_IRQn, priority_preempt: 15, priority_sub: 0, owner: cubemx_hal_tick}
  - {irqn: OTG_FS_IRQn, priority_preempt: 5, priority_sub: 0, owner: cubemx_usb_device_cdc}
  - {irqn: DMA1_Stream1_IRQn, priority_preempt: 5, priority_sub: 0, owner: cubemx_dr16_uart}
  - {irqn: USART3_IRQn, priority_preempt: 5, priority_sub: 0, owner: cubemx_dr16_uart}
  - {irqn: EXTI4_IRQn, priority_preempt: 5, priority_sub: 0, owner: cubemx_bmi088}
  - {irqn: EXTI9_5_IRQn, priority_preempt: 5, priority_sub: 0, owner: cubemx_bmi088}
  - {irqn: DMA2_Stream2_IRQn, priority_preempt: 5, priority_sub: 0, owner: cubemx_bmi088}
  - {irqn: DMA2_Stream3_IRQn, priority_preempt: 5, priority_sub: 0, owner: cubemx_bmi088}

timers:
  - {id: TIM6, func: HAL_1MS_TICK, owner: cubemx_hal_tick}
  - {id: TIM10_CH1, func: IMU_HEAT_PWM_500HZ, owner: cubemx_bmi088}
